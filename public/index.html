<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Morning Brief</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,500..600;1,500..600&display=swap" rel="stylesheet">
<style>
:root {
  --page-bg: #F7F7F7; --yellow: #FFE500; --brand-mark: #E9A23B; --text: #000; --text-body: rgba(60, 60, 67, 0.6); --text-muted: rgba(0, 0, 0, 0.3);
  --surface: rgba(0, 0, 0, 0.025); --hover: rgba(0, 0, 0, 0.04); --check-border: rgba(0, 0, 0, 0.25); --check-on: #fff;
  --content-max: 1160px; --page-pad: clamp(16px, 6vw, 90px); --content-pad: clamp(20px, 5vw, 60px); --indent: clamp(20px, 3vw, 32px);
  --font-display: 'Newsreader', Georgia, 'Times New Roman', serif;
  --font-body: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', sans-serif;
  --font-mono: 'SF Mono', 'Fira Mono', 'Roboto Mono', 'Courier New', monospace;
  --star: polygon(50% 0%, 60.9% 9.4%, 75% 6.7%, 79.7% 20.3%, 93.3% 25%, 90.6% 39.1%, 100% 50%, 90.6% 60.9%, 93.3% 75%, 79.7% 79.7%, 75% 93.3%, 60.9% 90.6%, 50% 100%, 39.1% 90.6%, 25% 93.3%, 20.3% 79.7%, 6.7% 75%, 9.4% 60.9%, 0% 50%, 9.4% 39.1%, 6.7% 25%, 20.3% 20.3%, 25% 6.7%, 39.1% 9.4%);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --page-bg: #111111; --brand-mark: #FFE500; --text: #F0F0F0; --text-body: rgba(235, 225, 210, 0.6); --text-muted: rgba(255, 255, 255, 0.3);
    --surface: rgba(255, 255, 255, 0.05); --hover: rgba(255, 255, 255, 0.06); --check-border: rgba(255, 255, 255, 0.25); --check-on: #111; }
}
:root[data-theme="dark"] { --page-bg: #111111; --brand-mark: #FFE500; --text: #F0F0F0; --text-body: rgba(235, 225, 210, 0.6); --text-muted: rgba(255, 255, 255, 0.3);
  --surface: rgba(255, 255, 255, 0.05); --hover: rgba(255, 255, 255, 0.06); --check-border: rgba(255, 255, 255, 0.25); --check-on: #111; }
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; color-scheme: light dark; }
:root[data-theme="light"] { color-scheme: light; }
:root[data-theme="dark"] { color-scheme: dark; }
body { font-family: var(--font-body); font-size: 16px; line-height: 1.6; color: var(--text); background: var(--page-bg); overflow-x: hidden; text-wrap: pretty; }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }

.page { position: relative; min-height: 100vh; padding: 26px var(--page-pad) 0; }
.brief-scale { width: min(100%, calc(var(--content-max) + 2 * var(--content-pad))); margin-inline: auto; container-type: inline-size; container-name: brief; }

.gear { position: fixed; top: 14px; right: 16px; z-index: 20; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; color: var(--text-muted); background: var(--surface); backdrop-filter: blur(8px); transition: color .2s, transform .4s ease, background .2s; }
.gear:hover, .gear.on { color: var(--text); transform: rotate(30deg); background: var(--hover); }
.gear svg { width: 15px; height: 15px; }
.settings { position: fixed; top: 50px; right: 16px; z-index: 21; width: min(300px, calc(100vw - 32px)); padding: 14px 14px 12px; border-radius: 12px; background: var(--page-bg); box-shadow: 0 12px 40px rgba(0,0,0,.14), 0 1px 0 rgba(0,0,0,.06) inset; border: 1px solid var(--surface); opacity: 0; transform: translateY(-6px) scale(.98); pointer-events: none; transition: opacity .2s ease, transform .2s cubic-bezier(.22,1,.36,1); }
.settings.open { opacity: 1; transform: none; pointer-events: auto; }
.settings h4 { font-family: var(--font-display); font-style: italic; font-weight: 550; font-size: 17px; margin: 0 0 8px 4px; }
.settings .row2 { display: flex; align-items: center; justify-content: space-between; padding: 4px 6px 10px; margin-bottom: 6px; border-bottom: 1px solid var(--surface); }
.settings .row2 h4 { margin: 0; }
.seg { display: inline-flex; gap: 2px; background: var(--surface); border-radius: 999px; padding: 3px; font-size: 11px; font-weight: 600; letter-spacing: .06em; }
.seg button { color: var(--text-muted); padding: 3px 10px; border-radius: 999px; }
.seg button.on { background: var(--yellow); color: #000; }
.settings label.opt.busy { opacity: .5; pointer-events: none; }
.painting-frame.loading .painting-img { opacity: .25; filter: blur(3px); transition: opacity .25s, filter .25s; }
.painting-frame.loading::after { content: ''; position: absolute; left: 50%; top: 50%; width: 28px; height: 28px; margin: -14px 0 0 -14px; border-radius: 50%; border: 2px solid rgba(255,229,0,.25); border-top-color: var(--yellow); animation: spin .8s linear infinite; z-index: 2; }
@keyframes spin { to { transform: rotate(360deg); } }
.settings label.opt { display: grid; grid-template-columns: 16px 1fr; gap: 10px; align-items: start; padding: 7px 6px; border-radius: 8px; cursor: pointer; font-size: 13px; line-height: 1.35; }
.settings label.opt:hover { background: var(--hover); }
.settings .opt input { margin: 2px 0 0; accent-color: #000; }
.settings .opt small { display: block; color: var(--text-muted); font-size: 11.5px; }
.settings .opt b { font-weight: 600; }
.settings .key { margin: 4px 6px 2px 32px; display: flex; gap: 6px; }
.settings .key input { flex: 1; min-width: 0; font: inherit; font-size: 12px; padding: 5px 8px; border-radius: 6px; border: 1px solid var(--check-border); background: transparent; color: var(--text); }
.settings .key button { font-size: 12px; font-weight: 600; padding: 5px 10px; border-radius: 6px; background: var(--yellow); color: #000; }
.settings .hint { margin: 8px 4px 0; font-size: 11px; color: var(--text-muted); line-height: 1.4; }
.painting-img.swap { opacity: 0; }

/* Hero */
.brand-mark { width: 27px; height: 26px; margin: 0 auto; background: var(--brand-mark); -webkit-mask: url(/favicon.svg) center / contain no-repeat; mask: url(/favicon.svg) center / contain no-repeat; }
.hero { position: relative; padding: 18px var(--content-pad) 0; }
.hero-edge { position: absolute; z-index: 3; top: 50%; font-family: var(--font-display); font-style: italic; font-weight: 550; font-size: clamp(1.25rem, 5cqw, 4.5rem); color: var(--text); line-height: 1; white-space: nowrap; writing-mode: vertical-lr; }
.hero-date { left: clamp(-3.75rem, -5cqw, 0px); transform: rotate(180deg) translateY(50%); }
.hero-time { right: clamp(-3.75rem, -5cqw, 0px); transform: translateY(-50%); font-feature-settings: "onum", "tnum"; }
.hero-edge-compact { display: none; text-align: center; font-family: var(--font-mono); font-size: 12px; letter-spacing: .04em; color: var(--text-muted); margin: 0 0 12px; }
.painting-frame { position: relative; width: 100%; aspect-ratio: 1160 / 600; overflow: hidden; background: #2a2826; }
.painting-img { width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 1.2s ease; }
.painting-img.loaded { opacity: 1; }
.painting-overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: none; }
.hero-the { font-family: var(--font-display); font-style: italic; font-weight: 550; font-size: clamp(1.65rem, 6cqw, 4.85rem); color: var(--yellow); line-height: 1; letter-spacing: -0.015em; text-shadow: 0 2px 20px rgba(0,0,0,.45), 0 0 60px rgba(0,0,0,.25); }
.hero-day { font-family: var(--font-display); font-weight: 550; font-size: clamp(1.5rem, 10.5cqw, 8.25rem); color: var(--yellow); line-height: .95; letter-spacing: -0.025em; text-shadow: 0 2px 30px rgba(0,0,0,.5), 0 0 80px rgba(0,0,0,.3); white-space: nowrap; max-width: 100%; overflow-wrap: break-word; }
.hero-sub { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); column-gap: 1.5rem; align-items: baseline; padding-top: 10px; }
.brief-blurb { grid-column: 1 / 8; font-family: var(--font-display); font-style: italic; font-weight: 550; font-size: clamp(.85rem, calc(.6rem + .75cqw), 1.1rem); line-height: 1.5; letter-spacing: -0.01em; color: var(--text-body); }
.painting-caption { grid-column: 8 / -1; font-family: var(--font-mono); font-size: clamp(8px, calc(6px + .45cqw), 10px); letter-spacing: .02em; color: var(--text-muted); text-align: right; line-height: 1.5; }

/* Content grid */
.content { width: 100%; padding: 48px var(--content-pad) clamp(48px, 12cqw, 120px); display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); column-gap: 1.5rem; row-gap: clamp(32px, 7cqw, 64px); font-size: clamp(14px, calc(8px + .95cqw), 18px); }
.brief-section { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); column-gap: 1.5rem; row-gap: 20px; }
.section-title { grid-column: 1 / -1; font-family: var(--font-display); font-style: italic; font-weight: 550; font-size: 1.47em; color: var(--text); opacity: .85; padding-left: var(--indent); line-height: 1.3; letter-spacing: -0.01em; }
.section-body { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); column-gap: 1.5rem; row-gap: clamp(28px, 4cqw, 40px); }
.brief-section--inline { row-gap: 0; }
.brief-section--inline .section-title { grid-column: 1 / 5; grid-row: 1; align-self: start; padding-top: .15em; }
.brief-section--inline .section-body { grid-column: 1 / -1; grid-row: 1; margin-top: .4em; }

/* Push */
.push-section { position: relative; background: var(--surface); border-radius: 12px; padding: clamp(20px, 3vw, 32px) 0; row-gap: 0; }
.push-section .section-title { grid-column: 1 / 6; grid-row: 1; align-self: start; padding-top: .05em; }
.push-body { grid-column: 6 / -1; grid-row: 1; padding-right: var(--indent); display: flex; flex-direction: column; gap: 8px; }
.push-topic { font-size: 1.1em; font-weight: 600; line-height: 1.5; display: flex; align-items: center; flex-wrap: wrap; gap: 2px 6px; }
.push-text { font-size: .95em; line-height: 1.7; color: var(--text-body); min-height: 3lh; }
.push-badge { position: absolute; bottom: -20px; left: 24px; transform: rotate(-5deg); transition: transform .3s ease .15s, filter .3s ease .15s; z-index: 1; }
.push-badge:hover { transform: rotate(-12deg); transition: transform .2s ease, filter .2s ease; filter: drop-shadow(0 2px 1px rgba(0,0,0,.1)); }
.star { position: relative; overflow: hidden; width: 7.5rem; height: 7.5rem; background: var(--yellow); clip-path: var(--star); display: flex; align-items: center; justify-content: center; }
.star::before { content: ''; position: absolute; top: -20%; left: -120%; width: 110%; height: 140%; background: linear-gradient(105deg, transparent 20%, rgba(255,255,255,.1) 30%, rgba(255,200,220,.2) 38%, rgba(200,220,255,.25) 46%, rgba(220,255,220,.2) 54%, rgba(255,240,200,.15) 62%, rgba(255,255,255,.1) 70%, transparent 80%); transform: skewX(-15deg); opacity: 0; pointer-events: none; }
.push-badge:hover .star::before, .prep-badge:hover .star::before { opacity: 1; animation: shine .6s ease-out forwards; }
@keyframes shine { 0% { left: -120%; } 100% { left: 140%; } }
.star-text { font-family: var(--font-display); font-style: italic; font-weight: 550; font-size: 1.3em; color: #000; transform: rotate(-5deg); text-align: center; line-height: 1.2; margin-top: -.125rem; letter-spacing: -0.01em; }
.star-arrow { font-family: var(--font-body); font-style: normal; font-size: .8em; opacity: .6; }
.push-badge:hover .star-arrow, .prep-badge:hover .star-arrow { opacity: 1; }

/* Todos */
.todo-item { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); column-gap: 1.5rem; align-items: start; }
.todo-surface { grid-column: 5 / -1; display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); column-gap: 1.5rem; align-items: start; position: relative; }
.todo-surface::before { content: ''; position: absolute; inset: -10px 0; border-radius: 12px; background: var(--hover); opacity: 0; transition: opacity .18s ease; pointer-events: none; }
.todo-item:hover:not(.done) .todo-surface::before { opacity: 1; }
.todo-checkbox { grid-column: 1; justify-self: start; padding: 4px 0 0 12px; position: relative; cursor: pointer; z-index: 1; }
.todo-check { display: block; width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid var(--check-border); transition: border-color .2s, background .2s, transform .15s; position: relative; }
.todo-checkbox:hover .todo-check { border-color: var(--text-body); }
.todo-checkbox:active .todo-check { transform: scale(1.3); }
.done .todo-check { border-color: var(--text); background: var(--text); animation: check-bounce .4s cubic-bezier(.34,1.56,.64,1); }
.done .todo-check::after { content: ''; position: absolute; left: 6px; top: 3px; width: 5px; height: 9px; border: solid var(--check-on); border-width: 0 1.5px 1.5px 0; transform: rotate(45deg); }
@keyframes check-bounce { 0% { transform: scale(1.3); } 40% { transform: scale(.85); } 70% { transform: scale(1.08); } 100% { transform: scale(1); } }
.todo-content { grid-column: 2 / -1; min-width: 0; display: flex; flex-direction: column; gap: 4px; transition: opacity .3s ease; z-index: 1; }
.done .todo-content { opacity: .4; }
.done .todo-label .t { text-decoration: line-through; }
.todo-label, .item-title { font-size: 1.1em; font-weight: 600; line-height: 1.5; display: flex; align-items: center; flex-wrap: wrap; gap: 2px 6px; }
.todo-label a:hover, .item-title a:hover { border-bottom: 1px solid var(--text-muted); }
.todo-context, .item-text { font-size: 1em; line-height: 1.8; color: var(--text-body); }
.item-tag { font-family: var(--font-display); font-style: italic; font-weight: 550; font-size: .85em; color: var(--text-muted); white-space: nowrap; margin-left: 4px; letter-spacing: -0.01em; }
.all-done { grid-column: 5 / -1; font-family: var(--font-display); font-style: italic; font-weight: 550; font-size: 1.2em; color: var(--text-body); padding-left: 12px; margin-top: 8px; letter-spacing: -0.01em; }

/* Source icons + avatars */
.source-icon { display: inline-flex; position: relative; width: 22px; height: 22px; vertical-align: middle; margin: 0 2px; color: var(--text); }
.source-icon svg { width: 100%; height: 100%; transform: rotate(var(--tilt, 0deg)); transition: transform .4s ease, opacity .3s ease; }
.source-icon:hover svg { transform: rotate(var(--hover-tilt, 8deg)); opacity: .7; }
.source-icon .source-tip { position: absolute; bottom: calc(100% + 8px); left: 50%; transform: translateX(-50%); font-family: var(--font-body); font-size: 12px; font-weight: 500; color: var(--page-bg); background: var(--text); padding: 5px 10px; border-radius: 6px; white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity .2s ease; z-index: 5; }
.source-icon:hover .source-tip { opacity: 1; }
.avatars { display: inline-flex; align-items: center; vertical-align: middle; margin-left: 4px; }
.avatar { width: 24px; height: 24px; border-radius: 50%; object-fit: cover; margin-left: -6px; border: 1.5px solid var(--page-bg); background: var(--surface); display: inline-grid; place-items: center; font-size: 9px; font-weight: 700; color: var(--text-body); overflow: hidden; }
.avatar:first-child { margin-left: 0; }
.avatar img { width: 100%; height: 100%; object-fit: cover; }

/* Updates */
.item { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); column-gap: 1.5rem; align-items: baseline; }
.item-num { font-family: var(--font-mono); font-size: .9em; color: var(--text-muted); letter-spacing: -0.01em; padding-left: var(--indent); }
.item-body { grid-column: 6 / -1; display: flex; flex-direction: column; gap: 8px; }
.item-text { padding-top: 4px; }

/* Schedule */
.brief-section--schedule .section-title { grid-column: 1 / 6; }
.schedule-card { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); column-gap: 1.5rem; align-items: start; }
.schedule-list { grid-column: 1 / 6; display: flex; flex-direction: column; padding-left: var(--indent); }
.schedule-item { display: flex; align-items: baseline; gap: 12px; font-size: 1.07em; line-height: 2.4; padding: 0 8px; margin: 0 -8px; border-radius: 6px; cursor: default; transition: background .15s ease; text-align: left; }
.schedule-item:hover, .schedule-item--active { background: var(--hover); }
.schedule-time { font-family: var(--font-mono); font-size: .9em; color: var(--text-muted); min-width: 5.2em; white-space: nowrap; letter-spacing: -0.01em; }
.schedule-item:hover .schedule-time, .schedule-item--active .schedule-time { color: var(--text-body); }
.schedule-event { font-weight: 600; }
.schedule-right { grid-column: 6 / -1; display: flex; flex-direction: column; gap: 12px; min-height: 170px; font-size: 1em; line-height: 1.8; }
.schedule-right strong { display: block; font-size: 1.15em; font-weight: 700; line-height: 1.4; margin-bottom: 6px; }
.schedule-right p { color: var(--text-body); }
.schedule-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.prep-badge { align-self: flex-end; transform: rotate(5deg); filter: drop-shadow(0 1px 3px rgba(0,0,0,.1)); transition: transform .3s ease .15s, filter .3s ease .15s; }
.prep-badge:hover { transform: rotate(12deg); transition: transform .2s ease, filter .2s ease; filter: drop-shadow(0 2px 1.5px rgba(0,0,0,.1)); }
.prep-badge .star { width: 120px; height: 120px; }
.prep-badge .star-text { transform: rotate(5deg); font-size: 1.2em; margin-top: -2px; }

/* Notes, empty, toast */
.notes { grid-column: 6 / -1; font-size: 12px; color: var(--text-muted); }
.notes summary { cursor: pointer; }
.notes ul { padding-left: 18px; margin-top: 6px; }
.empty { text-align: center; padding: 120px 20px; color: var(--text-body); }
.empty h2 { font-family: var(--font-display); font-style: italic; font-weight: 550; color: var(--text); font-size: 2.5rem; margin-bottom: 12px; }
.empty code { font-family: var(--font-mono); font-size: 13px; background: var(--surface); padding: 2px 6px; border-radius: 4px; }
.toast { position: fixed; left: 50%; bottom: 28px; transform: translate(-50%, 20px); background: var(--text); color: var(--page-bg); font-size: 13px; font-weight: 500; padding: 10px 16px; border-radius: 10px; opacity: 0; transition: opacity .25s, transform .25s; z-index: 30; pointer-events: none; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* Footer */
.brief-footer { position: relative; width: 100%; min-height: 300px; margin-top: clamp(12px, 2vw, 24px); padding: clamp(72px, 12vw, 120px) var(--content-pad) clamp(100px, 15vw, 160px); display: flex; flex-direction: column; align-items: center; justify-content: flex-end; overflow: hidden; isolation: isolate; }
.brief-footer__halftone { position: absolute; inset: 0; background-color: var(--page-bg); background-image: radial-gradient(circle, rgba(0,0,0,.14) .65px, transparent .65px); background-size: 5px 5px; -webkit-mask-image: radial-gradient(ellipse 90% 70% at 50% 100%, #000 15%, transparent 72%), linear-gradient(to top, #000 0%, transparent 55%); -webkit-mask-composite: source-in; mask-image: radial-gradient(ellipse 90% 70% at 50% 100%, #000 15%, transparent 72%), linear-gradient(to top, #000 0%, transparent 55%); mask-composite: intersect; pointer-events: none; z-index: 1; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .brief-footer__halftone { background-image: radial-gradient(circle, rgba(255,255,255,.1) .65px, transparent .65px); } }
:root[data-theme="dark"] .brief-footer__halftone { background-image: radial-gradient(circle, rgba(255,255,255,.1) .65px, transparent .65px); }
.brief-footer__inner { position: relative; z-index: 2; display: flex; flex-direction: column; align-items: center; gap: 24px; text-align: center; }
.brief-footer__credit { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 4.5px; font-family: var(--font-display); font-size: clamp(1.125rem, 1.6vw, 1.5rem); font-weight: 550; line-height: 32px; letter-spacing: -0.01em; }
.brief-footer__muted { color: var(--text-muted); }
.brief-footer__emph { font-style: italic; }
.brief-footer__brand { display: inline-flex; align-items: center; gap: 4.5px; }
.brief-footer__brand .source-icon { width: 21px; height: 21px; margin: 0; }
.brief-footer__love { display: flex; align-items: center; gap: 4px; font-family: var(--font-display); font-weight: 550; font-size: 15px; color: #8c8c8c; }
.brief-footer__circles { display: inline-flex; gap: 4px; }
.version { display: block; margin: 10px auto 0; font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .03em; color: var(--text-muted); opacity: .75; transition: opacity .2s, color .2s; }
.version:hover { opacity: 1; color: var(--text-body); }
.version.behind { color: #B8860B; opacity: 1; }
:root[data-theme="dark"] .version.behind, :root:not([data-theme="light"]) .version.behind { color: var(--yellow); }
.brief-footer__circle { display: inline-flex; align-items: center; justify-content: center; width: 19px; height: 19px; border: .5px solid #8c8c8c; border-radius: 50%; font-size: 12px; line-height: 1; color: #8c8c8c; }
.brief-footer__circles:hover .brief-footer__circle { animation: wave .82s cubic-bezier(.34,1.45,.56,1) 1 backwards; }
.brief-footer__circles:hover .brief-footer__circle:nth-child(2) { animation-delay: .11s; }
.brief-footer__circles:hover .brief-footer__circle:nth-child(3) { animation-delay: .22s; }
@keyframes wave { 0% { transform: translateY(0); } 38% { transform: translateY(-7px); } 58% { transform: translateY(1px); } 78% { transform: translateY(-2px); } 100% { transform: translateY(0); } }

/* Responsive */
@media (max-width: 1160px) {
  html { font-size: clamp(13px, 1.5vw, 16px); }
  .item-body, .schedule-right, .notes { grid-column: 5 / -1; }
  .todo-surface { grid-column: 4 / -1; grid-template-columns: repeat(9, minmax(0, 1fr)); }

  figma: `<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M8.7 22a3.3 3.3 0 0 0 3.3-3.3V15.4H8.7a3.3 3.3 0 0 0 0 6.6z" fill="#0ACF83"/><path d="M8.7 2h3.3v6.6H8.7a3.3 3.3 0 0 1 0-6.6z" fill="#F24E1E"/><path d="M15.3 8.6H12V2h3.3a3.3 3.3 0 0 1 0 6.6z" fill="#FF7262"/><path d="M8.7 15.4H12V8.8H8.7a3.3 3.3 0 0 0 0 6.6z" fill="#A259FF"/><circle cx="15.3" cy="12" r="3.3" fill="#1ABCFE"/></svg>`,
  gmail: `<svg viewBox="52 42 88 66" xmlns="http://www.w3.org/2000/svg"><path fill="#4285f4" d="M58 108h14V74L52 59v43c0 3.32 2.69 6 6 6"/><path fill="#34a853" d="M120 108h14c3.32 0 6-2.69 6-6V59l-20 15"/><path fill="#fbbc04" d="M120 48v26l20-15v-8c0-7.42-8.47-11.65-14.4-7.2"/><path fill="#ea4335" d="M72 74V48l24 18 24-18v26L96 92"/><path fill="#c5221f" d="M52 51v8l20 15V48l-5.6-4.2c-5.94-4.45-14.4-.22-14.4 7.2"/></svg>`,
  confluence: `<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M.87 17.6c-.25.41-.53.88-.77 1.25a.6.6 0 0 0 .2.79l4.97 3.05a.6.6 0 0 0 .83-.2c.2-.33.46-.76.74-1.22 1.96-3.25 3.94-2.85 7.5-1.15l4.93 2.34a.6.6 0 0 0 .8-.29l2.36-5.34a.6.6 0 0 0-.29-.79c-1.04-.49-3.1-1.46-4.96-2.36-6.7-3.25-12.38-3.04-16.73 4.03z" fill="#2684FF"/><path d="M23.13 5.47c.25-.4.52-.87.76-1.25a.6.6 0 0 0-.2-.79L18.67.13a.6.6 0 0 0-.83.25c-.2.33-.45.76-.73 1.22-1.97 3.25-3.94 2.85-7.5 1.15L4.7.42a.6.6 0 0 0-.79.29L1.54 6.05a.6.6 0 0 0 .29.79c1.04.49 3.1 1.46 4.96 2.36 6.7 3.25 12.39 3.03 16.74-4.03z" fill="#0052CC"/></svg>`,
};
// Fallback for any tool without a bespoke logo, so a new tool id still renders.
const genericIcon = (id) => `<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><rect width="24" height="24" rx="5" fill="currentColor" opacity=".16"/><text x="12" y="16.6" font-family="-apple-system, Helvetica, sans-serif" font-weight="700" font-size="12" text-anchor="middle" fill="currentColor">${(id[0] || '?').toUpperCase()}</text></svg>`;
const TOOL_NAMES = { slack: 'Slack', teams: 'Microsoft Teams', notion: 'Notion', jira: 'Jira', linear: 'Linear', asana: 'Asana', github: 'GitHub', gitlab: 'GitLab', outlook: 'Outlook', gmail: 'Gmail', confluence: 'Confluence', figma: 'Figma', drive: 'Drive', hubspot: 'HubSpot', salesforce: 'Salesforce', zendesk: 'Zendesk', clickup: 'ClickUp', monday: 'Monday.com', claude: 'Claude Code' };
const toolName = (id) => (id === 'gcal' || id === 'calendar') ? T().calendar : (TOOL_NAMES[id] ?? id.charAt(0).toUpperCase() + id.slice(1));
const calendarTool = () => state.tools.find((id) => id === 'outlook' || id === 'gcal') ?? 'calendar';
const toolList = () => {
  const ids = state.tools.length ? state.tools : ['slack', 'notion', 'github', 'gcal'];
  const chips = ids.map((id) => `<span class="brief-footer__brand">${srcIcon(id)}<span>${esc(toolName(id))}</span></span>`);
  if (chips.length === 1) return chips[0];
  return chips.slice(0, -1).join(',') + `<span class="brief-footer__muted">${T().and}</span>` + chips[chips.length - 1];
};
const srcIcon = (source, url) => {
  if (!source) return '';
  const svg = ICONS[source] ?? (source === 'gcal' ? ICONS.calendar : genericIcon(source));
  // Same subtle tilt as Dia: +/-1.5deg at rest, +/-10deg on hover.
  const tilt = (Math.random() * 3 - 1.5).toFixed(1);
  const hoverTilt = (Math.random() * 20 - 10).toFixed(0);
  const tag = url ? 'a' : 'span';
  const name = toolName(source);
  return `<${tag} class="source-icon" ${url ? `href="${esc(url)}" target="_blank" rel="noreferrer"` : ''} style="--tilt:${tilt}deg;--hover-tilt:${hoverTilt}deg">${svg}<span class="source-tip">${esc(url ? (lang === 'fr' ? `Ouvrir dans ${name}` : `Open in ${name}`) : name)}</span></${tag}>`;
};
const initials = (name) => String(name).split(/\s+/).map((w) => w[0]).join('').slice(0, 2).toUpperCase();
const avatars = (people = []) => people.length ? `<span class="avatars">${people.map((p) => {
  const name = typeof p === 'string' ? p : p.name;
  const img = typeof p === 'object' && p.avatar ? `<img src="${esc(p.avatar)}" alt="" referrerpolicy="no-referrer" onerror="this.remove()">` : '';
  return `<span class="avatar" title="${esc(name)}">${img}${esc(initials(name))}</span>`;
}).join('')}</span>` : '';

const fmtTime = (hhmm) => {
  const [h, m] = hhmm.split(':').map(Number);
  if (!T().hour12) return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
  return `${h % 12 || 12}:${String(m).padStart(2, '0')} ${h < 12 ? 'AM' : 'PM'}`;
};

let state = { brief: null, done: {}, workdir: '', name: '', tools: [] };
let settings = { artSource: 'met', hasUnsplashKey: false, sources: ['met'] };
let activeEvent = 0;

// Opens a new Claude Code session in the Claude desktop app, prompt pre-filled. Nothing is sent until the user presses Enter.
const openInClaude = (prompt, folder = state.workdir, note = T().opened) => {
  const full = `${prompt}\n\n${T().answer}`.slice(0, 12000);
  window.location.href = `claude://code/new?folder=${encodeURIComponent(folder)}&q=${encodeURIComponent(full)}&source=morning_brief`;
  toast(note);
};
let toastTimer;
const toast = (msg) => { const el = $('#toast'); el.textContent = msg; el.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), 2600); };


let artBusy = false;
const renderSettings = () => {
  const t = T();
  $('#settings').innerHTML = `<div class="row2"><h4>${t.language}</h4><span class="seg"><button data-lang="en" class="${lang === 'en' ? 'on' : ''}">EN</button><button data-lang="fr" class="${lang === 'fr' ? 'on' : ''}">FR</button></span></div>
    <div class="row2"><h4>${t.theme}</h4><span class="seg">${['auto', 'light', 'dark'].map((k) => `<button data-theme-choice="${k}" class="${theme === k ? 'on' : ''}">${t.themeNames[k]}</button>`).join('')}</span></div>
    <h4>${t.settingsTitle}</h4>
    ${settings.sources.map((k) => `<label class="opt ${artBusy ? 'busy' : ''}"><input type="radio" name="artSource" value="${k}" ${settings.artSource === k ? 'checked' : ''}><span><b>${esc(t.sources[k][0])}</b><small>${esc(t.sources[k][1])}</small></span></label>
      ${k === 'unsplash' && settings.artSource === 'unsplash' ? `<div class="key"><input id="unsplashKey" type="password" placeholder="${settings.hasUnsplashKey ? '••••••••' : esc(t.keyPlaceholder)}"><button id="saveKey">${t.save}</button></div>` : ''}`).join('')}
    <p class="hint">${t.settingsHint}</p>`;
};
const saveSettings = async (patch) => {
  artBusy = true;
  settings = { ...settings, ...patch };
  renderSettings();
  $('.painting-frame')?.classList.add('loading');
  try {
    settings = await (await fetch('/api/settings', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(patch) })).json();
    await loadArt(true);
  } finally { artBusy = false; renderSettings(); $('.painting-frame')?.classList.remove('loading'); }
};
const preload = (src) => new Promise((ok, ko) => { const i = new Image(); i.onload = ok; i.onerror = ko; i.src = src; });
const loadArt = async (swap = false) => {
  if (!state.brief) return;
  try {
    const r = await fetch(`/api/art?date=${state.brief.date}`);
    if (!r.ok) throw new Error((await r.json()).error || r.status);
    const art = await r.json();
    if (swap) await preload(art.image).catch(() => {});
    state.brief.art = art;
    render();
  } catch (e) { if (swap) toast(e.message); else render(); }
};
$('#gear').onclick = (ev) => { ev.stopPropagation(); renderSettings(); const open = $('#settings').classList.toggle('open'); $('#gear').classList.toggle('on', open); };
document.addEventListener('click', (ev) => { if (!ev.target.closest('#settings') && !ev.target.closest('#gear')) { $('#settings').classList.remove('open'); $('#gear').classList.remove('on'); } });
document.addEventListener('change', (ev) => { if (ev.target.name === 'artSource') saveSettings({ artSource: ev.target.value }); });
document.addEventListener('click', (ev) => { if (ev.target.id === 'saveKey') saveSettings({ artSource: 'unsplash', unsplashKey: $('#unsplashKey').value }); });


// Version line: shows the local commit, checks for newer ones on click, then hands
// the update to Claude (the routine's own prompt copy can only be refreshed there).
let version = null;
let behind = null;
const paintVersion = (label) => {
  const el = $('#version');
  if (!version) { el.hidden = true; return; }
  el.hidden = false;
  el.textContent = label ?? `${version.short} · ${new Date(version.date).toLocaleDateString(T().locale ?? undefined, { day: '2-digit', month: 'short', year: 'numeric' })}`;
  el.classList.toggle('behind', behind > 0);
};
const loadVersion = async () => {
  try { version = await (await fetch('/api/version')).json(); if (version.error) version = null; } catch { version = null; }
  paintVersion();
};
const checkVersion = async () => {
  if (behind > 0) {
    openInClaude(`Update Morning Brief: run \`git -C ${state.briefDir} pull\`, then read UPDATE.md in that folder and follow it step by step. My install is ${behind} commit(s) behind ${version.short}.`, state.briefDir, T().updating);
    return;
  }
  paintVersion(T().checking);
  try {
    const r = await (await fetch('/api/version/check')).json();
    if (r.unknown || typeof r.behind !== 'number') { paintVersion(); toast(r.error ?? T().upToDate); return; }
    behind = r.behind;
    if (behind > 0) paintVersion(T().behind(behind));
    else { paintVersion(T().upToDate); setTimeout(paintVersion, 2400); }
  } catch (e) { paintVersion(); toast(e.message); }
};

const render = () => {
  const t = T();
  document.documentElement.lang = lang;
  const { brief, done } = state;
  const app = $('#app');
  if (!brief) { app.innerHTML = `<div class="empty"><h2>${t.empty}</h2><p>${t.emptyHelp}</p></div>`; return; }

  const gen = new Date(brief.generatedAt);
  const dateLabel = `${String(gen.getDate()).padStart(2, '0')} ${t.months[gen.getMonth()]} ${gen.getFullYear()}`;
  const timeLabel = fmtTime(`${gen.getHours()}:${gen.getMinutes()}`).replace(/^(\d):/, '0$1:');
  const day = t.days[brief.weekday] ?? brief.weekday;
  const link = (item, text) => item.url ? `<a href="${esc(item.url)}" target="_blank" rel="noreferrer">${text}</a>` : text;
  const todos = brief.todos ?? [];
  const allDone = todos.length && todos.every((x) => done[x.id]);
  const events = brief.events ?? [];
  if (activeEvent >= events.length) activeEvent = 0;
  const ev = events[activeEvent];

  app.innerHTML = `
    <div class="brand-mark" role="img" aria-label="Morning Brief"></div>
    <header class="hero">
      <div class="hero-edge hero-date">${esc(dateLabel)}</div>
      <div class="hero-edge hero-time">${esc(timeLabel)}</div>
      <p class="hero-edge-compact">${esc(dateLabel)} · ${esc(timeLabel)}</p>
      <div class="painting-frame">
        ${brief.art?.image ? `<img class="painting-img" src="${esc(brief.art.image)}" alt="${esc(brief.art.title)}" onload="this.classList.add('loaded')">` : ''}
        <div class="painting-overlay"><span class="hero-the">${t.the}</span><h1 class="hero-day">${esc(t.brief(day))}</h1></div>
      </div>
      <div class="hero-sub">
        <p class="brief-blurb">${esc(tx(brief.summary))}</p>
        ${brief.art ? `<p class="painting-caption">${brief.art.link ? `<a href="${esc(brief.art.link)}" target="_blank" rel="noreferrer">` : ''}${esc(brief.art.caption || `${brief.art.title}, ${brief.art.artist}, ${brief.art.date}. ${(brief.art.medium || '').toLowerCase()}`)}${brief.art.link ? '</a>' : ''}</p>` : ''}
      </div>
    </header>

    <main class="content">
      ${brief.focus ? `<section class="brief-section push-section">
        <h2 class="section-title">${t.focus}</h2>
        <div class="push-body">
          <h3 class="push-topic">${esc(tx(brief.focus.title))}${srcIcon(brief.focus.source, brief.focus.url)}${avatars(brief.focus.people)}</h3>
          <p class="push-text">${esc(tx(brief.focus.body))}</p>
        </div>
        <button class="push-badge" data-ask="focus"><span class="star"><span class="star-text">${t.go} <span class="star-arrow">→</span></span></span></button>
      </section>` : ''}

      ${todos.length ? `<section class="brief-section brief-section--inline">
        <h2 class="section-title">${t.todos}</h2>
        <div class="section-body">
          ${todos.map((x) => `<article class="todo-item ${done[x.id] ? 'done' : ''}"><div class="todo-surface">
            <button class="todo-checkbox" aria-label="Mark done" data-toggle="${esc(x.id)}"><span class="todo-check"></span></button>
            <div class="todo-content">
              <h3 class="todo-label"><span class="t">${link(x, esc(tx(x.title)))}</span>${x.tag ? `<span class="item-tag">${esc(x.tag)}</span>` : ''}${srcIcon(x.source, x.url)}${avatars(x.people)}</h3>
              <p class="todo-context">${esc(tx(x.body))}</p>
            </div>
          </div></article>`).join('')}
          ${allDone ? `<p class="all-done">${t.allDone}</p>` : ''}
        </div>
      </section>` : ''}

      ${brief.updates?.length ? `<section class="brief-section">
        <h2 class="section-title">${t.updates}</h2>
        <div class="section-body">
          ${brief.updates.map((u, i) => `<article class="item"><span class="item-num">${String(i + 1).padStart(2, '0')}</span>
            <div class="item-body">
              <h3 class="item-title">${link(u, esc(tx(u.title)))}${u.tag ? `<span class="item-tag">${esc(u.tag)}</span>` : ''}${srcIcon(u.source, u.url)}${avatars(u.people)}</h3>
              <div class="item-text"><p>${esc(tx(u.body))}</p></div>
            </div></article>`).join('')}
        </div>
      </section>` : ''}

      ${events.length ? `<section class="brief-section brief-section--schedule">
        <h2 class="section-title">${t.day}</h2>
        <div class="schedule-card">
          <div class="schedule-list">
            ${events.map((e, i) => `<button class="schedule-item ${i === activeEvent ? 'schedule-item--active' : ''}" data-event="${i}"><span class="schedule-time">${esc(fmtTime(e.start))}</span><span class="schedule-event">${esc(tx(e.title))}</span></button>`).join('')}
          </div>
          <div class="schedule-right">
            <div>
              <strong>${link(ev, esc(tx(ev.title)))} — ${esc(fmtTime(ev.start))}${ev.end ? ` – ${esc(fmtTime(ev.end))}` : ''}</strong>
              <p>${esc(tx(ev.body))}</p>
              <div class="schedule-meta">${srcIcon(ev.source || calendarTool(), ev.url)}${avatars(ev.people)}</div>
            </div>
            ${ev.prepPrompt ? `<button class="prep-badge" data-ask="event:${activeEvent}"><span class="star"><span class="star-text">${t.prep} <span class="star-arrow">→</span></span></span></button>` : ''}
          </div>
        </div>
      </section>` : ''}

      ${brief.notes?.length ? `<details class="notes"><summary>${t.notes} (${brief.notes.length})</summary><ul>${brief.notes.map((n) => `<li>${esc(n)}</li>`).join('')}</ul></details>` : ''}
    </main>

    <footer class="brief-footer">
      <div class="brief-footer__halftone" aria-hidden="true"></div>
      <div class="brief-footer__inner">
        <p class="brief-footer__credit"><span class="brief-footer__muted">${t.made}</span><span class="brief-footer__brand">${srcIcon('claude')}<span>Claude Code</span></span><span class="brief-footer__muted">${t.using}</span><span class="brief-footer__muted brief-footer__emph">${t.your}</span>
          ${toolList()}.</p>
        <p class="brief-footer__love"><span>${t.love}</span><span class="brief-footer__circles"><span class="brief-footer__circle">T</span><span class="brief-footer__circle">D</span><span class="brief-footer__circle">Q</span></span></p>
        <button class="version" id="version" hidden></button>
      </div>
    </footer>`;
  const v = $('#version');
  if (v) { v.onclick = checkVersion; paintVersion(behind > 0 ? T().behind(behind) : undefined); }
};

const load = async () => {
  state = await (await fetch('/api/brief')).json();
  if (state.brief && !(state.brief.events?.length)) {
    try {
      const cal = await (await fetch(`/api/calendar?date=${state.brief.date}`)).json();
      if (cal.configured) state.brief.events = cal.events.map((e) => ({ start: e.start, end: e.end, title: e.title, body: (e.description || '').split('\n')[0].slice(0, 140), people: e.attendees.map((name) => ({ name })),
        prepPrompt: `Prepare ${state.name || 'me'} for the meeting "${e.title}" today at ${e.start}${e.attendees.length ? ` with ${e.attendees.join(', ')}` : ''}. ${e.description ? `Description: ${e.description}` : ''} Give the 3 things to know and 1 question to ask.` }));
    } catch {}
  }
  if (state.brief?.events?.length) {
    const now = new Date(); const hm = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
    const idx = state.brief.events.findIndex((e) => (e.end ?? e.start) >= hm);
    activeEvent = idx < 0 ? state.brief.events.length - 1 : idx;
  }
  render();
  try { settings = await (await fetch('/api/settings')).json(); } catch {}
  await loadVersion();
  await loadArt(false);
};

document.addEventListener('click', async (ev) => {
  const lb = ev.target.closest('[data-lang]');
  if (lb) { lang = lb.dataset.lang; try { localStorage.setItem('brief.lang', lang); } catch {} render(); renderSettings(); return; }
  const tb = ev.target.closest('[data-theme-choice]');
  if (tb) { theme = tb.dataset.themeChoice; try { localStorage.setItem('brief.theme', theme); } catch {} applyTheme(); renderSettings(); return; }
  const toggle = ev.target.closest('[data-toggle]');
  if (toggle) {
    const id = toggle.dataset.toggle;
    const todo = state.brief.todos.find((x) => x.id === id);
    const r = await fetch('/api/todo', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ id, title: tx(todo?.title), done: !state.done[id] }) });
    state.done = (await r.json()).done;
    render(); return;
  }
  const sched = ev.target.closest('[data-event]');
  if (sched) { activeEvent = Number(sched.dataset.event); render(); return; }
  const ask = ev.target.closest('[data-ask]');
  if (ask) {
    const key = ask.dataset.ask;
    const b = state.brief;
    if (key === 'focus') openInClaude(`Morning brief, ${b.date}. Focus of the day: ${tx(b.focus.title)}\n${tx(b.focus.body)}\n\nTask:\n${b.focus.prompt}`);
    else { const e = b.events[Number(key.split(':')[1])]; openInClaude(`Morning brief, ${b.date}. Meeting prep: ${tx(e.title)} (${e.start}${e.end ? `–${e.end}` : ''}).\n${tx(e.body)}\n\nTask:\n${e.prepPrompt}`); }
  }
});

load();
</script>
</body>
</html>
